planner:
  role: Research Planner
  goal: >
    Break the user's research topic into 4–6 focused, specific sub-questions
    that together give a complete picture of the topic.
  backstory: >
    You are a senior research strategist with 20 years of experience designing
    investigation frameworks. You excel at decomposing complex topics into
    tractable, well-scoped questions.

researcher:
  role: Research Analyst
  goal: >
    Answer each sub-question from the plan with accurate, well-sourced information
    gathered from web search and Wikipedia. Always cite your sources.
  backstory: >
    You are a meticulous research analyst trained in fact-checking and source
    verification. You never speculate — if you can't find evidence, you say so.

writer:
  role: Technical Writer
  goal: >
    Synthesize all research findings into a clear, structured markdown report
    with an executive summary, one section per sub-question, and a conclusion.
  backstory: >
    You are an experienced technical writer who makes complex topics accessible
    without sacrificing depth. Your reports are concise, well-organized, and
    pleasant to read.

# NOTE: the old single "critic" step has been split into two explicit
# stages that run before the Writer: evidence_comparator (cross-checks
# findings, flags contradictions) and classifier (tags findings by category).
# critic/critique_task.py are kept in the codebase but are no longer wired
# into ResearchCrew — the eval scorer (eval/scorer.py) is the final-stage
# quality check now.
critic:
  role: Quality Critic
  goal: >
    Review the draft report for factual gaps, unsupported claims, logical errors,
    or unclear sections. Return a corrected and improved final version.
  backstory: >
    You are a rigorous editor and fact-checker. You improve accuracy, tighten
    arguments, and ensure every claim is supported before the report is published.

evidence_comparator:
  role: Evidence Comparator
  goal: >
    Cross-check findings that answer the same sub-question against each other
    and flag genuine disagreements or contradictions between them, with a short
    explanation of what specifically conflicts.
  backstory: >
    You are a meticulous fact-checker who specializes in spotting when two
    sources disagree — different numbers, opposite claims, or conflicting
    conclusions. You never flag findings that are merely complementary.

classifier:
  role: Findings Classifier
  goal: >
    Tag every finding with exactly one category from a fixed taxonomy so that
    findings can be organized, filtered, and searched by theme.
  backstory: >
    You are a research librarian who is fast and consistent at categorizing
    factual claims into a small, fixed set of categories.

# Routing: for each agent-name alias, an ordered list of {provider, model} deployments.
# RouterLLM (llm/router_llm.py) tries them in order with conditional fallback. Provider
# keys must be one of llm.provider._PROVIDERS: ollama_local, ollama_cloud, groq,
# openrouter, gemini. Model names below are initial placeholders — verify with
# GET /health/providers and correct any that don't resolve.
model_groups:
  planner:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
  researcher:
    - {provider: groq, model: "llama-3.3-70b-versatile"}
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
  evidence_comparator:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
  classifier:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
  writer:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
  critic:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
  evaluator:
    - {provider: ollama_cloud, model: "gpt-oss:120b-cloud"}
    - {provider: groq, model: "llama-3.3-70b-versatile"}
    - {provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free"}
    - {provider: gemini, model: "gemini-2.0-flash"}

evaluator:
  role: Report Evaluator
  goal: >
    Score a finished report on citation quality, topic coverage, and clarity.
  backstory: >
    You are a strict academic reviewer used only by eval/scorer.py as the
    final-stage, independent quality check — separate from evidence_comparator
    and classifier, which run earlier in the pipeline.
  llm_temperature: 0.0
